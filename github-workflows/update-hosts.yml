# Auto-update hosts using GitHub's runners (runs on GitHub infrastructure)
name: Update hosts

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Run manually: Actions → Update hosts → Run workflow

# Required for GITHUB_TOKEN to push commits (otherwise root hosts file won't update)
permissions:
  contents: write

# Opt into Node.js 24 for JS actions (checkout, etc.) — avoids deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build hosts
        run: python build_hosts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts
          [ -d PIHOLE ] && git add PIHOLE/hosts
          git status
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update hosts [skip ci]"
            git push
          else
            echo "No changes to hosts; skip push."
          fi
